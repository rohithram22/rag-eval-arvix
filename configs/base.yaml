# Base configuration. Every experiment = this file + a few dotted overrides,
# e.g. {"chunking.chunk_size": 256, "retrieval.mode": "hybrid"}.

project:
  name: rag-eval-arxiv
  seed: 42

paths:
  raw_dir: data/raw             # downloaded PDFs (gitignored)
  processed_dir: data/processed # parsed/cleaned text (gitignored)
  index_dir: indexes            # FAISS/BM25 indexes, one per chunking hash (gitignored)
  eval_dir: eval                # golden Q/A set (committed)
  results_dir: results          # metrics tables (committed)
  cache_dir: .cache             # LLM response cache (gitignored)

corpus:
  # Refined in Step 2. Coherent topic -> harder, more realistic questions.
  arxiv_query: 'cat:cs.CL AND (abs:"retrieval-augmented" OR abs:"retrieval augmented")'
  max_papers: 150

chunking:
  chunk_size: 512      # tokens per chunk
  chunk_overlap: 64    # tokens shared between consecutive chunks

embedding:
  model_name: BAAI/bge-small-en-v1.5
  batch_size: 32

retrieval:
  mode: dense          # dense | bm25 | hybrid
  top_k: 5             # chunks passed to the LLM
  candidate_k: 20      # chunks fetched before fusion/reranking

reranker:
  enabled: false
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_n: 5

# --- LLM roles (model IDs change on free tiers: run
#     `python scripts/check_env.py --list-models` and edit here if needed) ---
generator:             # answers questions from retrieved context
  provider: groq
  model: openai/gpt-oss-20b
  temperature: 0.0
  max_tokens: 1024     # reasoning model: budget includes its thinking tokens
  extra:               # provider-specific options, passed through to the API
    reasoning_effort: low

qgen:                  # drafts golden-set candidates (Step 5)
  provider: groq
  model: openai/gpt-oss-120b
  temperature: 0.7
  max_tokens: 2048     # reasoning model: budget includes its thinking tokens

judge:                 # scores faithfulness / relevance (Step 6); different family on purpose
  provider: gemini
  model: gemini-3.5-flash-lite
  temperature: 0.0
  max_tokens: 1024
